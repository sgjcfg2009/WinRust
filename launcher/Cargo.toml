[package]
name = "plugin-launcher"
version = "0.5.7"
edition = "2024"
license = "MIT OR Apache-2.0"

[[bin]]
name = "plugin-launcher"
path = "main.rs"
test = false # the embedded manifest demands admin: a test exe could not start from a normal shell

[[test]]
name = "install-selection"
path = "selection.rs"

[[test]]
name = "explorer-service-settings"
path = "dword_snapshot.rs"

[dependencies]
winrust-common = { path = "../common" }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Graphics_GdiPlus", "Win32_Security", "Win32_System_Console", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Registry", "Win32_System_RemoteDesktop", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
embed-resource = "3"
