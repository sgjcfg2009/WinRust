# One workspace: one Cargo.lock, one target\ (every exe lands in target\release), shared dependencies are built once.
[workspace]
resolver = "2"
members = [
    "common",
    "apps",
    "launcher",
]
# Stay separate projects with their own target\ and Cargo.lock, because they need panic = "unwind" (the profile below is
# shared by every member): rust-search's service threads must not take the process down.
exclude = ["rust-search"]

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 4
panic = "abort"
strip = true

[profile.release.package.winrust-apps]
opt-level = 3
codegen-units = 1
